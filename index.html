<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryzal - Live Worker Tracking</title>
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar */
        .navbar {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        /* Map Container */
        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
        }

        /* Info Card Overlay */
        .info-card {
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 20px;
            z-index: 1000;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .worker-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .worker-name {
            font-size: 18px;
            font-weight: 700;
            color: #f8fafc;
        }

        .worker-phone {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .duty-tag {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .duty-on {
            background: #059669;
            color: #ffffff;
        }

        .duty-off {
            background: #dc2626;
            color: #ffffff;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 600;
        }

        .detail-value {
            font-size: 14px;
            color: #e2e8f0;
            font-weight: 500;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="brand">
            <span class="brand-title">📍 Ryzal Live Tracker</span>
        </div>
        <div class="status-badge" id="statusBadge">
            <div class="pulse-dot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <!-- Map View -->
    <div id="map"></div>

    <!-- Live Info Panel -->
    <div class="info-card">
        <div class="worker-header">
            <div>
                <div class="worker-name" id="workerName">Worker Phone: --</div>
                <div class="worker-phone" id="workerPhone">Connecting to Firebase...</div>
            </div>
            <span class="duty-tag duty-off" id="dutyBadge">OFF</span>
        </div>

        <div class="details-grid">
            <div class="detail-item">
                <span class="detail-label">Latitude</span>
                <span class="detail-value" id="latVal">--</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Longitude</span>
                <span class="detail-value" id="lngVal">--</span>
            </div>
            <div class="detail-item" style="grid-column: span 2;">
                <span class="detail-label">Last Updated</span>
                <span class="detail-value" id="lastUpdatedVal">--</span>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase JS SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        // -------------------------------------------------------------
        // 1. AAPKA FIREBASE CONFIGURATION
        // -------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyCTt-YyQKjQi2BqVKPQFks8gs_lKJu7bCY",
            authDomain: "ryzal-9e640.firebaseapp.com",
            projectId: "ryzal-9e640",
            storageBucket: "ryzal-9e640.firebasestorage.app",
            messagingSenderId: "937460285426",
            appId: "1:937460285426:android:4f58163140b33c36fa756b"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // URL query param se worker phone number nikalna (e.g., ?phone=03001234567)
        const urlParams = new URLSearchParams(window.location.search);
        const workerPhoneParam = urlParams.get('phone') || "03001234567";

        // -------------------------------------------------------------
        // 2. MAP INITIALIZATION (OpenStreetMap France Tiles)
        // -------------------------------------------------------------
        const map = L.map('map', { zoomControl: false }).setView([30.3753, 69.3451], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
            maxZoom: 20,
            attribution: '&copy; OpenStreetMap France | &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
		
        // Custom Glowing Pulse Marker Icon
        const customIcon = L.divIcon({
            className: 'custom-pin',
            html: `
                <div style="
                    width: 20px; 
                    height: 20px; 
                    background: #38bdf8; 
                    border: 3px solid #ffffff; 
                    border-radius: 50%; 
                    box-shadow: 0 0 15px #38bdf8;
                "></div>
            `,
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });

        let marker = null;

        // -------------------------------------------------------------
        // 3. REAL-TIME FIRESTORE LISTENER
        // -------------------------------------------------------------
        document.getElementById('workerPhone').innerText = "Phone: " + workerPhoneParam;
        document.getElementById('workerName').innerText = "Worker: " + workerPhoneParam;

        db.collection("active_workers").doc(workerPhoneParam)
            .onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    const lat = data.latitude;
                    const lng = data.longitude;
                    const dutyStatus = data.dutyStatus || "OFF";
                    const lastUpdated = data.lastUpdated || data.timestamp || Date.now();

                    // Update UI Stats
                    document.getElementById('latVal').innerText = lat ? lat.toFixed(6) : "--";
                    document.getElementById('lngVal').innerText = lng ? lng.toFixed(6) : "--";
                    
                    const timeStr = new Date(lastUpdated).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    document.getElementById('lastUpdatedVal').innerText = timeStr;

                    const dutyBadge = document.getElementById('dutyBadge');
                    if (dutyStatus === "ON") {
                        dutyBadge.innerText = "ON DUTY";
                        dutyBadge.className = "duty-tag duty-on";
                        document.getElementById('statusText').innerText = "Live Connected";
                    } else {
                        dutyBadge.innerText = "OFF DUTY";
                        dutyBadge.className = "duty-tag duty-off";
                        document.getElementById('statusText').innerText = "Worker Off Duty";
                    }

                    // Live Marker Update
                    if (lat && lng) {
                        const newLatLng = [lat, lng];

                        if (!marker) {
                            marker = L.marker(newLatLng, { icon: customIcon }).addTo(map);
                            map.setView(newLatLng, 16);
                        } else {
                            marker.setLatLng(newLatLng);
                            map.panTo(newLatLng, { animate: true, duration: 1.0 });
                        }
                    }
                } else {
                    document.getElementById('statusText').innerText = "No Data Found";
                }
            }, (error) => {
                console.error("Firestore Error: ", error);
                document.getElementById('statusText').innerText = "Error Loading Data";
            });
    </script>
</body>
</html>
